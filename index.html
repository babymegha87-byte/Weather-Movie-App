<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather & Movie Explorer</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>🌦️ Weather & Movie Explorer</h1>
        <p class="subtitle">Check the weather and discover movies!</p>

        <!-- WEATHER SECTION -->
        <section class="app-section">
            <h2>🌤️ Weather Search</h2>

            <form id="weatherForm">
                <input
                    type="text"
                    id="cityInput"
                    placeholder="Enter city name"
                    aria-label="City name"
                    required
                >
                <button type="submit" id="searchBtn">Search</button>
            </form>

            <p id="message" role="status">
                Enter a city to see its weather.
            </p>

            <section id="weather" class="weather-card" hidden>
                <h3 id="cityName"></h3>
                <img id="weatherIcon" alt="Weather icon">
                <p id="description"></p>
                <p id="temperature" class="temperature"></p>

                <div class="details">
                    <div class="detail">
                        <span>Humidity</span>
                        <strong id="humidity"></strong>
                    </div>
                    <div class="detail">
                        <span>Wind Speed</span>
                        <strong id="wind"></strong>
                    </div>
                </div>
            </section>
        </section>

        <hr>

        <!-- MOVIE SECTION -->
        <section class="app-section">
            <h2>🎬 Movie Search</h2>
            <p class="subtitle">Find your next favourite movie</p>

            <form id="movieForm">
                <input
                    type="text"
                    id="movieInput"
                    placeholder="Search movies..."
                    aria-label="Movie name"
                    required
                >
                <button type="submit" id="movieSearchBtn">
                    Search Movies
                </button>
            </form>

            <p id="movieMessage" role="status">
                Search for a movie to get started.
            </p>

            <section id="movieResults" class="movie-grid"></section>
        </section>

        <footer>
            <p>Weather powered by OpenWeather | Movies powered by OMDb</p>
        </footer>
    </main>
</body>
</html>
